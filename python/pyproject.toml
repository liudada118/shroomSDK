[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shroom-sdk"
version = "0.7.0"
description = "Shroom pressure sensor SDK: product protocols, serial frames, stream server and recordings"
readme = "README.md"
requires-python = ">=3.10"
# 与 npm 包的 "UNLICENSED" 一致：专有软件，使用受 SDK 产品密钥约束，不授予开源许可。
license = "LicenseRef-Proprietary"
keywords = ["pressure sensor", "tactile", "glove", "insole", "serial", "websocket"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/liudada118/shroomSDK"
Documentation = "https://github.com/liudada118/shroomSDK/blob/main/python/README.md"
Changelog = "https://github.com/liudada118/shroomSDK/blob/main/CHANGELOG.md"
Issues = "https://github.com/liudada118/shroomSDK/issues"

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
license = ["cryptography>=43"]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
shroom-demo = "shroom_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shroom_sdk = ["py.typed"]
