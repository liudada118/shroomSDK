[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shroom-sdk"
version = "0.1.0"
description = "Shroom pressure sensor SDK: serial frames, layouts and mock devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
license = ["cryptography>=43"]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
shroom-demo = "shroom_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shroom_sdk = ["py.typed"]
